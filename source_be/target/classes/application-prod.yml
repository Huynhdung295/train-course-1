# application-prod.yml — Production profile
# Activated by: spring.profiles.active=prod (or SPRING_PROFILES_ACTIVE=prod env var)
# Features: Strict security, minimal logging, connection pooling, SSL

spring:
  datasource:
    # Use environment variables for production credentials (never hardcode!)
    url: ${DB_URL:jdbc:postgresql://db:5432/ecommerce}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    show-sql: false  # Never log SQL in production
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  # Production Redis with password and SSL
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  # Production Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      compression-type: lz4

  # Production RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}

logging:
  level:
    root: WARN
    com.app: INFO
    org.springframework: WARN
    org.hibernate: WARN

# JWT - longer expiry in production (still short for security)
app:
  jwt:
    access-token-expiry: 900    # 15 minutes
    refresh-token-expiry: 604800 # 7 days

# Actuator - restrict exposed endpoints in production
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
