# ─── LOCAL PROFILE (H2 In-Memory) ─────────────────────────────────────────────
# Activated by: -Dspring.profiles.active=local  (or SPRING_PROFILES_ACTIVE=local)
# 
# Purpose: Run the full app on your laptop with ZERO external dependencies.
# No Docker, no Postgres, no Redis, no Kafka needed.
# 
# How to run:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
# ──────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:h2:mem:nexus_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console   # Access at: http://localhost:8080/h2-console

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop  # Auto-create schema from entities (Local only!)
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false  # Skip Flyway migrations for local (DDL auto-create handles it)

  # Disable Kafka and Redis in local mode to avoid connection errors
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

logging:
  level:
    com.app: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
  jwt:
    access-token-expiry: 86400  # 24h for easy local testing

# Actuator — expose everything locally
management:
  endpoints:
    web:
      exposure:
        include: "*"
