# application-dev.yml — Development profile
# Activated by: spring.profiles.active=dev
# Features: Relaxed security, verbose logging, H2 console, local DB

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nexus_erp
    username: nexus_admin
    password: nexus_secret

  # Use H2 for fast local testing (optional, switch to PostgreSQL if needed)
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Local Redis (no password)
  data:
    redis:
      host: localhost
      port: 6379

  # Local Kafka
  kafka:
    bootstrap-servers: localhost:9093

  # Local RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Local Mail/SMTP (e.g. MailHog)
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  level:
    com.app: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# Disable rate limiting in dev
ratelimiting:
  enabled: false

# Shorter token expiry for easier testing
app:
  jwt:
    access-token-expiry: 3600   # 1 hour
    refresh-token-expiry: 86400 # 24 hours

# Actuator - expose all endpoints in dev
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
