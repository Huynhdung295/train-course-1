spring:
  application:
    name: core-api
  config:
    systemName: CoreApi
    maxRetries: 3
    featureToggle:
      newCheckoutFlow: true
      experimentalUi: false
  webauthn:
    rp-id: "company.com"
    rp-name: "Company App"
    origins:
      - "https://app.company.com"
      - "https://company.com"
      - "http://localhost:3000"
    challenge-ttl: PT5M
  profiles:
    active: dev
  cloud:
    gateway:
      routes:
        - id: order_route
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate # Should always be validate in production/enterprise
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          fetch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25
        generate_statistics: true # Detect N+1 issues
        jdbc:
          batch_size: 50 # Batch inserts/updates

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
    republish-outstanding-events-on-restart: true

  kafka:
    bootstrap-servers: localhost:9092
    
  data:
    redis:
      host: localhost
      port: 6379

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
      port: 6379

  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.app: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE # To see SQL parameters
