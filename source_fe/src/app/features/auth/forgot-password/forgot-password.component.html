<div>
      <h1 class="login__title">Quên mật khẩu</h1>
      <p class="login__subtitle">Nhập email để nhận link đặt lại mật khẩu</p>

      @if (!sent()) {
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login__form" novalidate>
          <div class="form-group">
            <label for="reset-email" class="form-label">Email</label>
            <input
              id="reset-email"
              type="email"
              formControlName="email"
              class="form-input"
              placeholder="email@company.com"
              autocomplete="email"
            />
          </div>

          <button
            type="submit"
            class="btn btn--primary btn--full"
            [disabled]="form.invalid || submitting()"
            id="forgot-password-btn"
          >
            @if (submitting()) {
              <span class="btn__spinner"></span> Đang gửi...
            } @else {
              Gửi link đặt lại
            }
          </button>

          <a routerLink="/auth/login" class="btn btn--outline btn--full">← Quay lại đăng nhập</a>
        </form>
      } @else {
        <div style="text-align: center; padding: var(--space-4) 0">
          <div style="font-size: 3rem; margin-bottom: var(--space-4)">📧</div>
          <p class="text-sm" style="margin-bottom: var(--space-6)">
            Chúng tôi đã gửi link đặt lại mật khẩu đến <strong>{{ form.get('email')?.value }}</strong>.
            Vui lòng kiểm tra hộp thư.
          </p>
          <a routerLink="/auth/login" class="btn btn--primary btn--full">← Về trang đăng nhập</a>
        </div>
      }
    </div>
