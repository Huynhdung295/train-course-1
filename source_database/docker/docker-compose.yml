version: '3.8'

# ─── DATABASE INFRASTRUCTURE (Local/Staging) ─────────────────────────────────
# Full stack cho Database team và DBA để test migration, CDC pipeline.
# Usage: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Primary Write Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus_write_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nexus_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexus_secret}
      POSTGRES_DB: ${DB_NAME:-nexus_erp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/01_init_roles.sh:/docker-entrypoint-initdb.d/01_init_roles.sh
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexus_admin} -d ${DB_NAME:-nexus_erp}"]
      interval: 5s
      retries: 5

  # ── Identity & Access Management ─────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: nexus_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER:-nexus_admin}
      KC_DB_PASSWORD: ${DB_PASSWORD:-nexus_secret}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin123}
    ports:
      - "8180:8080"   # Keycloak Admin UI at http://localhost:8180
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy

  # ── Kafka + Zookeeper (for CDC / Debezium) ────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nexus_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexus_kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9093:9093"

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    container_name: nexus_kafka_connect
    depends_on:
      - kafka
      - postgres
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: nexus-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: nexus-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: nexus-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: nexus-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components
    ports:
      - "8083:8083"   # Kafka Connect REST API
    volumes:
      - ./etl-cdc:/connectors

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexus_kafka_ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: nexus-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "8082:8080"   # Kafka UI at http://localhost:8082

  # ── Elasticsearch (Read-Model / CQRS) ────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nexus_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: nexus_kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"   # Kibana UI at http://localhost:5601

  # ── Redis (Cache & Redisson Locks) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── RabbitMQ (Message Broker) ───────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexus_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  es_data:
  redis_data:
  rabbitmq_data:
