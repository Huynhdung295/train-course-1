version: '3.8'

# Dành cho FE Devs: Chạy file này để khởi tạo ngay lập tức Backend Mock + DB ảo
# Lệnh: docker compose -f docker-compose.local.yml up -d

services:
  # Mock Backend (Dùng Prism hoặc Json-server để giả lập API)
  backend-mock:
    image: stoplight/prism:latest
    command: mock -h 0.0.0.0 /tmp/swagger.yaml
    volumes:
      - ./docs/api-specs/swagger.yaml:/tmp/swagger.yaml
    ports:
      - "8080:4010"
    
  # Redis (Nếu FE cần test chức năng giỏ hàng lưu cache)
  redis-local:
    image: redis:alpine
    ports:
      - "6379:6379"
