user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096; # Tăng connection để chịu tải tốt hơn
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==========================================
    # CẤU HÌNH UPSTREAM KEEPALIVE (Enterprise Standard)
    # ==========================================
    upstream backend_api {
        server nexus_backend:8080;
        keepalive 32; # Giữ 32 connections TCP sống liên tục để giảm latency
    }

    upstream frontend_web {
        server nexus_frontend:3000;
        keepalive 32;
    }

    upstream grafana_dashboard {
        server nexus_grafana:3000;
        keepalive 16;
    }

    # ==========================================
    # MICROCACHING (Đỡ đạn cho Backend)
    # ==========================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=MICROCACHE:10m max_size=1g inactive=60m use_temp_path=off;

    # ==========================================
    # CẤU HÌNH CLOUDFLARE REAL-IP
    # ==========================================
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # ==========================================
    # RATE LIMITING (ANTI-DDOS)
    # ==========================================
    limit_req_zone $binary_remote_addr zone=nexus_limit:10m rate=20r/s;
    limit_req_status 429;

    # Tối ưu hóa Log
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Bật nén Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name ~^(?<tenant>.+)\.nexus\.com$;

        ssl_certificate /etc/letsencrypt/live/nexus.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nexus.com/privkey.pem;

        # Bảo mật SSL cực mạnh (Bỏ TLS 1.0, 1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # HTTP SECURITY HEADERS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # ROUTE TO GRAFANA
        location /monitoring/ {
            proxy_pass http://grafana_dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ROUTE TO BACKEND API
        location /api/ {
            limit_req zone=nexus_limit burst=10 nodelay;
            
            # Cấu hình Microcaching cho các API GET
            proxy_cache MICROCACHE;
            proxy_cache_valid 200 1s;
            proxy_cache_methods GET HEAD;
            proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            
            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;
            
            proxy_set_header X-Tenant-ID $tenant;
            proxy_set_header Host $host;
            proxy_set_header Connection ""; # Required cho Keepalive
        }

        # ROUTE TO FRONTEND
        location / {
            proxy_pass http://frontend_web;
            proxy_http_version 1.1;
            
            proxy_set_header X-Tenant-ID $tenant;
            proxy_set_header Host $host;
            proxy_set_header Connection ""; # Required cho Keepalive
        }
    }
}
