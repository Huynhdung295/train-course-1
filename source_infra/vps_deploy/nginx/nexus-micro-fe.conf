# ═══════════════════════════════════════════════════════════════
# Nexus Micro Frontend – Nginx Reverse Proxy Configuration
# Deploy to: /etc/nginx/sites-available/nexus-micro-fe.conf
# ═══════════════════════════════════════════════════════════════

# ── Upstream definitions ──────────────────────────────────────
upstream shell_app {
    server 127.0.0.1:3000;
}

upstream mfe_erp_app {
    server 127.0.0.1:3003;
}

upstream mfe_catalog_app {
    server 127.0.0.1:3004;
}

upstream backend_api {
    server 127.0.0.1:8080;
}

# ── Main Shell App (Next.js 16 – PM2) ────────────────────────
server {
    listen 80;
    server_name nexus.yourdomain.com;

    # Redirect HTTP → HTTPS (uncomment after Certbot setup)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://shell_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── MFE-AUTH (Vite static build) ──────────────────────────────
server {
    listen 3001;
    server_name mfe-auth.nexus.internal;
    root /var/www/nexus/mfe-auth;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # CORS for Module Federation
    location ~ \.(js|css|json|wasm)$ {
        add_header Access-Control-Allow-Origin "https://nexus.yourdomain.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # remoteEntry.js – NEVER cache
    location /remoteEntry.js {
        add_header Access-Control-Allow-Origin "https://nexus.yourdomain.com" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}

# ── MFE-POS (Vite static build) ──────────────────────────────
server {
    listen 3002;
    server_name mfe-pos.nexus.internal;
    root /var/www/nexus/mfe-pos;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.(js|css|json|wasm)$ {
        add_header Access-Control-Allow-Origin "https://nexus.yourdomain.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /remoteEntry.js {
        add_header Access-Control-Allow-Origin "https://nexus.yourdomain.com" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# ── MFE-ERP (Next.js 16 – PM2) ───────────────────────────────
server {
    listen 80;
    server_name mfe-erp.nexus.internal;

    location / {
        proxy_pass http://mfe_erp_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ── MFE-CATALOG (Nuxt 4 – PM2) ───────────────────────────────
server {
    listen 80;
    server_name mfe-catalog.nexus.internal;

    location / {
        proxy_pass http://mfe_catalog_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ── MFE-USERS (Angular static build) ─────────────────────────
server {
    listen 3005;
    server_name mfe-users.nexus.internal;
    root /var/www/nexus/mfe-users;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.(js|css|json|wasm)$ {
        add_header Access-Control-Allow-Origin "https://nexus.yourdomain.com" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /remoteEntry.js {
        add_header Access-Control-Allow-Origin "https://nexus.yourdomain.com" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# ── MFE-MARKETING (Astro 7 static) ───────────────────────────
server {
    listen 3006;
    server_name mfe-marketing.nexus.internal;
    root /var/www/nexus/mfe-marketing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.(js|css|json|wasm|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Backend API Proxy ─────────────────────────────────────────
server {
    listen 80;
    server_name api.nexus.yourdomain.com;

    # SSE – disable buffering for realtime
    location /api/v1/sse/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
